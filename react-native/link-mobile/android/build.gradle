def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: 'com.android.library'
if (!plugins.hasPlugin('org.jetbrains.kotlin.android')) {
    apply plugin: 'kotlin-android'
}
if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

android {
    namespace 'com.lastlock.linkmobile'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://maven.pkg.github.com/last-lock/link-mobile-sdk-prod'
        credentials {
            username = rootProject.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = rootProject.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
        }
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.lastlock.prod:bridge-android:2.7.3'
    implementation 'io.ktor:ktor-io:2.3.7'
    testImplementation 'junit:junit:4.13.2'
}
