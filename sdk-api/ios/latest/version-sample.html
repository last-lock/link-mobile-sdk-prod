<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SDK Version Sample</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #111318;
        color: #e7edf7;
      }
      .wrap {
        max-width: 760px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .card {
        border: 1px solid #303744;
        border-radius: 12px;
        padding: 20px;
        background: #171b23;
      }
      .label {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9fb0cb;
      }
      .version {
        margin-top: 8px;
        font-size: 32px;
        font-weight: 700;
      }
      .path {
        margin-top: 14px;
        color: #a8b6cc;
        word-break: break-all;
      }
    </style>
      <link id="link-favicon" rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">
</head>
  <body>
    <main class="wrap">
      <section class="card">
        <div class="label">iOS Docs SDK Version</div>
        <div id="version" class="version">SDK latest</div>
        <div id="path" class="path"></div>
      </section>
    </main>
    <script>
      (function() {
        var match = window.location.pathname.match(/\/sdk-api\/ios\/([^\/]+)/i);
        var version = match ? decodeURIComponent(match[1]) : "latest";
        document.getElementById("version").textContent = "SDK " + version;
        document.getElementById("path").textContent = "Path: " + window.location.pathname;
      })();
    </script>
  <template id="custom-header">
  <style>
    :host { display: block; }
    .doc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 24px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      background: #0b0f14;
      color: #e6eef5;
    }
    :host([data-color-scheme="light"]) .doc-header {
      background: #ffffff;
      color: #0b0f14;
      border-bottom-color: rgba(0, 0, 0, 0.08);
    }
    :host([data-color-scheme="dark"]) .doc-header {
      background: #0b0f14;
      color: #e6eef5;
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    .doc-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
      font: 600 16px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0.2px;
    }
    .doc-logo {
      height: 28px;
      width: auto;
      display: block;
    }
    .doc-version-badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(127, 127, 127, 0.4);
      border-radius: 999px;
      padding: 4px 10px;
      font: 600 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0.02em;
      color: inherit;
      opacity: 0.9;
    }
  </style>
  <header class="doc-header">
    <a class="doc-brand" href="/sdk-api/ios/latest/" aria-label="LinkMobile Documentation">
      <img class="doc-logo" src="logo.png" alt="Seamless Link logo">
      <span>LinkMobile</span>
    </a>
    <span class="doc-version-badge" data-sdk-version>SDK latest</span>
  </header>
</template>
<script id="sdk-version-script">
(function(){
  function normalizeBase(base){
    if(!base) return '/';
    return base.endsWith('/') ? base : (base + '/');
  }
  function setFavicon(base){
    var icon = document.getElementById('link-favicon');
    if(!icon) return;
    icon.setAttribute('href', base + 'favicon.svg');
  }
  function getSdkVersion(){
    var match = window.location.pathname.match(/\/sdk-api\/(?:ios|android)\/([^\/]+)/i);
    return match ? decodeURIComponent(match[1]) : 'latest';
  }
  function setBrandAssets(){
    var header = document.querySelector('custom-header');
    if(!header || !header.shadowRoot) return false;
    var link = header.shadowRoot.querySelector('.doc-brand');
    var logo = header.shadowRoot.querySelector('.doc-logo');
    var version = header.shadowRoot.querySelector('[data-sdk-version]');
    var base = normalizeBase(window.baseUrl || '/');
    setFavicon(base);
    if(link) link.setAttribute('href', base);
    if(logo) logo.setAttribute('src', base + 'logo.png');
    if(version) version.textContent = 'SDK ' + getSdkVersion();
    return true;
  }
  function trySet(){
    if(setBrandAssets()) return;
    setTimeout(trySet, 50);
  }
  if(document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', trySet);
  } else {
    trySet();
  }
})();
</script>
</body>
</html>
